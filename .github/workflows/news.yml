name: Refresh news feed
on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch: {}
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Refresh data/news.json
        run: node tools/refresh-news.mjs
      - name: Commit if changed
        run: |
          git config user.name "news-bot"
          git config user.email "actions@github.com"
          if ! git diff --quiet -- data/news.json; then
            git add data/news.json
            git commit -m "chore: refresh news feed"
            git push
          else
            echo "No changes."
          fi
      - name: Mirror main to gh-pages (live site)
        run: git push origin HEAD:gh-pages --force
